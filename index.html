<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sumeth Popcat!</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-family: 'Arial Rounded MT Bold', Arial, sans-serif;
      overflow: hidden;
      cursor: pointer;
      user-select: none;
    }

    /* Background particles */
    #bg-canvas {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 0;
    }

    .container {
      position: relative;
      z-index: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 18px;
    }

    h1 {
      font-size: 2.8rem;
      color: #FFD700;
      text-shadow: 0 0 20px rgba(255,215,0,0.6), 3px 3px 0 #c8950a;
      letter-spacing: 3px;
      animation: titlePulse 2s ease-in-out infinite;
    }
    @keyframes titlePulse {
      0%,100% { transform: scale(1); }
      50% { transform: scale(1.03); }
    }

    /* Counter */
    #counterWrap {
      display: flex;
      align-items: center;
      gap: 14px;
    }
    #counter {
      font-size: 4.5rem;
      font-weight: 900;
      color: #fff;
      min-width: 200px;
      text-align: center;
      text-shadow: 0 0 30px rgba(255,255,255,0.3);
      transition: transform 0.07s;
      line-height: 1;
    }
    #counter.pop { transform: scale(1.18); color: #FFD700; }

    /* PPS badge */
    #pps {
      font-size: 1rem;
      color: rgba(255,255,255,0.6);
      background: rgba(255,255,255,0.1);
      border: 1px solid rgba(255,255,255,0.15);
      padding: 5px 14px;
      border-radius: 20px;
      letter-spacing: 1px;
    }

    /* Rank bar */
    #rankWrap {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      width: min(340px, 90vw);
    }
    #rankLabel {
      font-size: 1rem;
      color: rgba(255,255,255,0.75);
      letter-spacing: 1px;
    }
    #rankBar {
      width: 100%;
      height: 12px;
      background: rgba(255,255,255,0.1);
      border-radius: 6px;
      overflow: hidden;
    }
    #rankFill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #FFD700, #FF6B6B);
      border-radius: 6px;
      transition: width 0.3s ease;
    }

    /* Cat container */
    #catWrap {
      position: relative;
      width: 280px;
      height: 280px;
      filter: drop-shadow(0 12px 40px rgba(0,0,0,0.5));
    }

    /* Cat body drawn with CSS */
    .cat {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* Photo face */
    #catImg {
      display: block;
      width: min(280px, 80vw);
      height: min(280px, 80vw);
      object-fit: cover;
      border-radius: 50%;
      border: 4px solid rgba(255,215,0,0.4);
      box-shadow: 0 0 0 0 rgba(255,215,0,0);
      cursor: pointer;
      transition: transform 0.08s ease, box-shadow 0.08s ease;
    }
    #catImg.popped {
      transform: scale(1.07);
      box-shadow: 0 0 32px 8px rgba(255,215,0,0.55);
    }
    #catImg:active { transform: scale(0.95); }

    /* Click label */
    #clickLabel {
      font-size: 1.2rem;
      color: rgba(255,255,255,0.55);
      letter-spacing: 2px;
      animation: blink 1.5s ease-in-out infinite;
    }
    @keyframes blink {
      0%,100% { opacity: 1; }
      50% { opacity: 0.35; }
    }

    /* Milestones */
    #milestoneMsg {
      position: fixed;
      top: 60px;
      left: 50%;
      transform: translateX(-50%);
      background: linear-gradient(90deg, #FFD700, #FF6B6B);
      color: #1a1a2e;
      font-size: 1.4rem;
      font-weight: 900;
      padding: 12px 36px;
      border-radius: 40px;
      pointer-events: none;
      opacity: 0;
      z-index: 100;
      white-space: nowrap;
      box-shadow: 0 6px 28px rgba(255,107,107,0.4);
    }
    #milestoneMsg.show {
      animation: milestoneAnim 2.2s ease forwards;
    }
    @keyframes milestoneAnim {
      0%   { opacity: 0; transform: translateX(-50%) translateY(-20px) scale(0.85); }
      15%  { opacity: 1; transform: translateX(-50%) translateY(0)     scale(1.08); }
      75%  { opacity: 1; transform: translateX(-50%) translateY(0)     scale(1);    }
      100% { opacity: 0; transform: translateX(-50%) translateY(-30px) scale(0.9);  }
    }

    /* Pop numbers flying up */
    .pop-num {
      position: fixed;
      font-size: 1.6rem;
      font-weight: 900;
      color: #FFD700;
      pointer-events: none;
      z-index: 50;
      text-shadow: 0 2px 8px rgba(0,0,0,0.4);
      animation: floatUp 0.9s ease-out forwards;
    }
    @keyframes floatUp {
      0%   { opacity: 1; transform: translateY(0) scale(1); }
      100% { opacity: 0; transform: translateY(-90px) scale(1.4); }
    }

    /* Stats bar */
    #stats {
      display: flex;
      gap: 20px;
      margin-top: 6px;
    }
    .stat-badge {
      background: rgba(255,255,255,0.09);
      border: 1px solid rgba(255,255,255,0.16);
      color: white;
      padding: 7px 18px;
      border-radius: 20px;
      font-size: 14px;
      text-align: center;
    }
    .stat-badge span { display: block; font-size: 11px; color: rgba(255,255,255,0.5); margin-top: 2px; }

    /* Reset button */
    #resetBtn {
      background: rgba(231,76,60,0.2);
      border: 1px solid rgba(231,76,60,0.5);
      color: #e74c3c;
      padding: 8px 22px;
      border-radius: 20px;
      cursor: pointer;
      font-size: 13px;
      font-weight: bold;
      letter-spacing: 1px;
      transition: all 0.2s;
    }
    #resetBtn:hover {
      background: rgba(231,76,60,0.4);
      transform: scale(1.05);
    }

    /* ─── RESPONSIVE ─────────────────────────────────────── */
    @media (max-width: 480px) {
      h1 { font-size: 1.8rem; letter-spacing: 1px; }
      #counter { font-size: 3rem; min-width: 140px; }
      #pps { font-size: 0.85rem; padding: 4px 10px; }
      #rankWrap { width: 90vw; }
      #catImg { width: min(72vw, 280px); height: min(72vw, 280px); }
      #clickLabel { font-size: 0.95rem; letter-spacing: 1px; }
      #stats { flex-wrap: wrap; justify-content: center; gap: 10px; }
      .stat-badge { padding: 6px 12px; font-size: 13px; }
      #milestoneMsg { font-size: 1.1rem; padding: 10px 22px; white-space: normal; text-align: center; max-width: 90vw; }
    }
    @media (max-width: 360px) {
      h1 { font-size: 1.5rem; }
      #counter { font-size: 2.4rem; }
      #catImg { width: 80vw; height: 80vw; }
    }
    @media (min-width: 481px) and (max-width: 768px) {
      h1 { font-size: 2.2rem; }
      #counter { font-size: 3.8rem; }
      #catImg { width: 240px; height: 240px; }
    }

    /* ─── USERNAME MODAL ──────────────────────────────────── */
    #usernameModal {
      position: fixed; inset: 0; z-index: 200;
      background: rgba(0,0,0,0.75);
      display: flex; align-items: center; justify-content: center;
    }
    #usernameModal.hidden { display: none; }
    #usernameBox {
      background: #16213e;
      border: 2px solid rgba(255,215,0,0.4);
      border-radius: 20px;
      padding: 36px 32px;
      text-align: center;
      width: min(380px, 90vw);
      box-shadow: 0 16px 48px rgba(0,0,0,0.6);
    }
    #usernameBox h2 { color: #FFD700; font-size: 1.6rem; margin-bottom: 10px; }
    #usernameBox p  { color: rgba(255,255,255,0.6); font-size: 0.9rem; margin-bottom: 20px; }
    #usernameInput {
      width: 100%; padding: 12px 16px;
      border-radius: 12px; border: 2px solid rgba(255,215,0,0.35);
      background: rgba(255,255,255,0.07); color: white;
      font-size: 1.1rem; text-align: center;
      outline: none;
    }
    #usernameInput:focus { border-color: #FFD700; }
    #startBtn {
      margin-top: 16px; width: 100%;
      padding: 12px; border-radius: 12px;
      background: linear-gradient(90deg, #FFD700, #FF8C00);
      border: none; cursor: pointer;
      font-size: 1.1rem; font-weight: 900; color: #1a1a2e;
      transition: transform 0.15s, box-shadow 0.15s;
    }
    #startBtn:hover { transform: scale(1.04); box-shadow: 0 6px 20px rgba(255,215,0,0.4); }

    /* ─── LEADERBOARD ─────────────────────────────────────── */
    #leaderboard {
      width: min(360px, 92vw);
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: 16px;
      padding: 14px 18px;
      margin-top: 4px;
    }
    #leaderboard h3 {
      color: #FFD700; font-size: 1rem; letter-spacing: 1px;
      margin-bottom: 10px; text-align: center;
    }
    #lbList { list-style: none; display: flex; flex-direction: column; gap: 6px; }
    #lbList li {
      display: flex; align-items: center; gap: 10px;
      background: rgba(255,255,255,0.06);
      border-radius: 10px; padding: 7px 12px;
      font-size: 0.9rem; color: white;
      transition: background 0.3s;
    }
    #lbList li.me { background: rgba(255,215,0,0.18); border: 1px solid rgba(255,215,0,0.3); }
    #lbList li .lb-rank { font-size: 1.2rem; width: 28px; text-align: center; }
    #lbList li .lb-name { flex: 1; font-weight: bold; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    #lbList li .lb-score { color: #FFD700; font-weight: 900; font-size: 1rem; }
    #lbList li .lb-pps { color: rgba(255,255,255,0.45); font-size: 0.75rem; }
    #onlineCount {
      text-align: center; margin-top: 8px;
      font-size: 0.8rem; color: rgba(255,255,255,0.4);
    }
    #onlineCount span { color: #2ecc71; font-weight: bold; }
  </style>
</head>
<body>

<canvas id="bg-canvas"></canvas>

<!-- Username Modal -->
<div id="usernameModal">
  <div id="usernameBox">
    <h2>🐱 ยินดีต้อนรับ!</h2>
    <p>ใส่ชื่อของคุณเพื่อแข่ง pop กับเพื่อน</p>
    <input id="usernameInput" type="text" maxlength="20" placeholder="ชื่อของคุณ..."
           onkeydown="if(event.key==='Enter') startGame()" autofocus />
    <button id="startBtn" onclick="startGame()">🚀 เริ่มเลย!</button>
  </div>
</div>

<div class="container">
  <h1>� SUMETH POP!</h1>

  <div id="counterWrap">
    <div id="counter">0</div>
  </div>
  <div id="pps">0.0 pops/sec</div>

  <div id="rankWrap">
    <div id="rankLabel">🐾 Rank: Newbie</div>
    <div id="rankBar"><div id="rankFill"></div></div>
  </div>

  <img id="catImg" src="IMG_1126.JPG" alt="popcat" draggable="false">

  <div id="clickLabel">คลิก / แตะ เพื่อ POP!</div>

  <div id="stats">
    <div class="stat-badge">
      <strong id="bestPPS">0.0</strong>
      <span>Best PPS</span>
    </div>
    <div class="stat-badge">
      <strong id="totalSess">0</strong>
      <span>Session Pops</span>
    </div>

      <strong id="streakEl">0</strong>
      <span>🔥 Streak</span>

  </div>

  </div>
</div>

<div id="milestoneMsg"></div>

<!-- Firebase -->
<script type="module">
import { initializeApp }                    from 'https://www.gstatic.com/firebasejs/10.11.1/firebase-app.js';
import { getDatabase, ref, set, onValue,
         serverTimestamp, onDisconnect,
         runTransaction }                   from 'https://www.gstatic.com/firebasejs/10.11.1/firebase-database.js';

const firebaseConfig = {
  apiKey:            'AIzaSyCzk2OfDGjDgv-CxTCAt5adxnep5SK5bTQ',
  authDomain:        'sumeth-pop.firebaseapp.com',
  databaseURL:       'https://sumeth-pop-default-rtdb.asia-southeast1.firebasedatabase.app',
  projectId:         'sumeth-pop',
  storageBucket:     'sumeth-pop.firebasestorage.app',
  messagingSenderId: '995810358540',
  appId:             '1:995810358540:web:4f0675661519040ef7c529',
};
const app = initializeApp(firebaseConfig);
const db  = getDatabase(app);

// Expose to global scope so the main script can call them
window._fbReady = { db, ref, set, onValue, serverTimestamp, onDisconnect, runTransaction };
window.dispatchEvent(new Event('fb-ready'));
</script>

<script>
// ─── BG PARTICLES ──────────────────────────────────────────────────────────
const bgCanvas = document.getElementById('bg-canvas');
const bgCtx    = bgCanvas.getContext('2d');
let bgW, bgH, bgParticles = [];

function resizeBg() {
  bgW = bgCanvas.width  = window.innerWidth;
  bgH = bgCanvas.height = window.innerHeight;
}
resizeBg();
window.addEventListener('resize', resizeBg);

for (let i = 0; i < 80; i++) bgParticles.push({
  x: Math.random() * 2000,
  y: Math.random() * 1200,
  r: 1 + Math.random() * 2.5,
  vx: (Math.random() - 0.5) * 0.35,
  vy: (Math.random() - 0.5) * 0.35,
  alpha: 0.15 + Math.random() * 0.5,
});

function animBg() {
  bgCtx.clearRect(0, 0, bgW, bgH);
  for (const p of bgParticles) {
    p.x = (p.x + p.vx + bgW) % bgW;
    p.y = (p.y + p.vy + bgH) % bgH;
    bgCtx.beginPath();
    bgCtx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
    bgCtx.fillStyle = `rgba(255,215,0,${p.alpha})`;
    bgCtx.fill();
  }
  requestAnimationFrame(animBg);
}
animBg();

// ─── PHOTO ANIMATION ─────────────────────────────────────────────────────
const catImg    = document.getElementById('catImg');
const IMG_CLOSED = 'IMG_1126.JPG';
const IMG_OPEN   = 'IMG_1127.JPG';
let openTimer  = null;
let popLevel   = 0;

function openFace() {
  catImg.src = IMG_OPEN;
  catImg.classList.add('popped');
  clearTimeout(openTimer);
  openTimer = setTimeout(() => {
    catImg.src = IMG_CLOSED;
    catImg.classList.remove('popped');
  }, 120);
}

// ─── GAME STATE ────────────────────────────────────────────────────────────
let count      = 0;
let sessionPops = 0;
let bestPPS    = 0;
let streak     = 0;
let lastClick  = 0;
const popTimes = [];

const RANKS = [
  { name: 'Newbie 🐣',     min: 0,      max: 50    },
  { name: 'Clicker 🐱',    min: 50,     max: 200   },
  { name: 'Popper 😺',     min: 200,    max: 500   },
  { name: 'Maniac 😼',     min: 500,    max: 1500  },
  { name: 'Nyan Cat 🌈',   min: 1500,   max: 5000  },
  { name: 'God of Pop ⭐', min: 5000,   max: Infinity },
];
const MILESTONES = [10, 50, 100, 250, 500, 1000, 2500, 5000, 10000, 25000, 50000, 100000];
let nextMilestoneIdx = 0;

function getRank(n) {
  for (let i = RANKS.length - 1; i >= 0; i--) {
    if (n >= RANKS[i].min) return { rank: RANKS[i], next: RANKS[i + 1] || null, idx: i };
  }
  return { rank: RANKS[0], next: RANKS[1], idx: 0 };
}

function updateUI() {
  const el = document.getElementById('counter');
  el.textContent = count.toLocaleString();
  el.classList.add('pop');
  setTimeout(() => el.classList.remove('pop'), 80);

  document.getElementById('totalSess').textContent = sessionPops.toLocaleString();
  document.getElementById('streakEl').textContent  = streak;

  // PPS
  const now = performance.now();
  popTimes.push(now);
  while (popTimes.length > 0 && popTimes[0] < now - 3000) popTimes.shift();
  const pps = (popTimes.length / 3).toFixed(1);
  document.getElementById('pps').textContent = pps + ' pops/sec';
  if (parseFloat(pps) > bestPPS) {
    bestPPS = parseFloat(pps);
    document.getElementById('bestPPS').textContent = bestPPS.toFixed(1);
  }

  // Rank bar
  const { rank, next, idx } = getRank(count);
  const name = rank.name;
  document.getElementById('rankLabel').textContent = '🐾 Rank: ' + name;
  if (next) {
    const pct = Math.min(100, (count - rank.min) / (next.min - rank.min) * 100);
    document.getElementById('rankFill').style.width = pct + '%';
  } else {
    document.getElementById('rankFill').style.width = '100%';
  }

  // Pop level (for visual effects)
  popLevel = Math.min(4, idx);
}

function spawnPopNum(x, y) {
  const el = document.createElement('div');
  el.className = 'pop-num';
  el.textContent = '+1';
  el.style.left = x + 'px';
  el.style.top  = y + 'px';
  document.body.appendChild(el);
  el.addEventListener('animationend', () => el.remove());
}

function checkMilestone() {
  while (nextMilestoneIdx < MILESTONES.length && count >= MILESTONES[nextMilestoneIdx]) {
    showMilestone(`🎉 ${MILESTONES[nextMilestoneIdx].toLocaleString()} Pops!`);
    nextMilestoneIdx++;
  }
}

function showMilestone(msg) {
  const el = document.getElementById('milestoneMsg');
  el.textContent = msg;
  el.classList.remove('show');
  void el.offsetWidth; // reflow
  el.classList.add('show');
}

function doClick(e) {
  // Client-side rate limit: max 20 clicks/sec
  const now = Date.now();
  if (!window._clickTimes) window._clickTimes = [];
  window._clickTimes.push(now);
  window._clickTimes = window._clickTimes.filter(t => t > now - 1000);
  if (window._clickTimes.length > 20) return;

  count++;
  sessionPops++;

  // Streak
  const now = Date.now();
  if (now - lastClick < 800) { streak++; } else { streak = 1; }
  lastClick = now;

  openFace();
  checkMilestone();
  updateUI();

  // Pop number at click position
  const rect = catImg.getBoundingClientRect();
  const cx   = e ? (e.touches ? e.touches[0].clientX : e.clientX) : rect.left + rect.width / 2;
  const cy   = e ? (e.touches ? e.touches[0].clientY : e.clientY) : rect.top  + rect.height / 2;
  spawnPopNum(cx - 12, cy - 20);
}

catImg.addEventListener('click',      doClick);
catImg.addEventListener('touchstart', e => { e.preventDefault(); doClick(e); }, { passive: false });
document.addEventListener('keydown', e => { if (e.code === 'Space') { e.preventDefault(); doClick(); } });

// Preload open image
const _preload = new Image(); _preload.src = IMG_OPEN;

function resetGame() {
  if (!confirm('รีเซ็ตคะแนนทั้งหมด?')) return;
  count = 0; sessionPops = 0; streak = 0; bestPPS = 0; nextMilestoneIdx = 0;
  popTimes.length = 0;
  document.getElementById('counter').textContent = '0';
  document.getElementById('pps').textContent = '0.0 pops/sec';
  document.getElementById('bestPPS').textContent = '0.0';
  document.getElementById('totalSess').textContent = '0';
  document.getElementById('streakEl').textContent = '0';
  document.getElementById('rankLabel').textContent = '🐾 Rank: Newbie 🐣';
  document.getElementById('rankFill').style.width = '0%';
  popLevel = 0;
  catImg.src = IMG_CLOSED;
  catImg.classList.remove('popped');
  if (window._uid) syncScore();
}

// ─── FIREBASE LEADERBOARD ───────────────────────────────────────────────
// uid = random per session
window._uid      = null;
window._username = null;
let _syncTimer   = null;

const MEDALS = ['🥇','🥈','🥉','👍','👍','👍','👍','👍','👍','👍'];

function genUID() {
  return Math.random().toString(36).slice(2) + Date.now().toString(36);
}

function syncScore() {
  const { db, ref, set, serverTimestamp } = window._fbReady;
  if (!window._uid) return;
  set(ref(db, 'players/' + window._uid), {
    name:      window._username,
    score:     count,
    pps:       parseFloat(document.getElementById('pps').textContent) || 0,
    updatedAt: serverTimestamp(),
  });
}

function renderLeaderboard(snap) {
  const data = snap.val() || {};
  const list = Object.entries(data)
    .map(([uid, v]) => ({ uid, ...v }))
    .sort((a, b) => b.score - a.score)
    .slice(0, 10);

  document.getElementById('onlineNum').textContent = list.length;
  const ul = document.getElementById('lbList');
  ul.innerHTML = '';
  list.forEach((p, i) => {
    const li  = document.createElement('li');
    const isMe = p.uid === window._uid;
    if (isMe) li.classList.add('me');
    li.innerHTML = `
      <span class="lb-rank">${MEDALS[i] ?? (i+1)}</span>
      <span class="lb-name">${escHtml(p.name)}${isMe ? ' <em style="opacity:.55;font-style:normal">(you)</em>' : ''}</span>
      <span class="lb-pps">${(p.pps||0).toFixed(1)}/s</span>
      <span class="lb-score">${(p.score||0).toLocaleString()}</span>
    `;
    ul.appendChild(li);
  });
}

function escHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function initFirebase() {
  const { db, ref, set, onValue, serverTimestamp, onDisconnect } = window._fbReady;
  window._uid = genUID();

  // Remove player on disconnect
  const playerRef = ref(db, 'players/' + window._uid);
  onDisconnect(playerRef).remove();

  // Listen to all players real-time
  onValue(ref(db, 'players'), renderLeaderboard);

  // Sync score every 3 seconds
  _syncTimer = setInterval(syncScore, 3000);
}

function startGame() {
  const input = document.getElementById('usernameInput');
  const name  = input.value.trim();
  if (!name) { input.focus(); input.style.borderColor='#e74c3c'; return; }
  window._username = name;
  document.getElementById('usernameModal').classList.add('hidden');
  if (window._fbReady) { initFirebase(); } else {
    window.addEventListener('fb-ready', initFirebase, { once: true });
  }
}
window.startGame = startGame;

// Auto-sync on each doClick (debounced)
const _origDoClick = doClick;
window.doClick = function(e) {
  _origDoClick.call(this, e);
  clearTimeout(window._clickDebounce);
  window._clickDebounce = setTimeout(syncScore, 500);
};
// Re-bind events to new doClick
catImg.removeEventListener('click', _origDoClick);
catImg.addEventListener('click', window.doClick);

// Firebase ready check (module may load after script)
if (window._fbReady && window._username) initFirebase();
</script>
</body>
</html>
